name: Language metrics

on:
  schedule:
    - cron: "0 0 * * *"
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - ".github/workflows/metrics.yml"
      - "scripts/generate-language-metrics.mjs"
      - "package.json"
      - "package-lock.json"

permissions:
  contents: write

concurrency:
  group: profile-language-metrics
  cancel-in-progress: true

jobs:
  generate:
    runs-on: ubuntu-latest
    steps:
      - name: Check out profile repository
        uses: actions/checkout@v7

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 26
          cache: npm

      - name: Install LinguistJS
        run: npm ci

      - name: Generate complete language metrics
        run: npm run generate:metrics
        env:
          METRICS_TOKEN: ${{ secrets.METRICS_TOKEN }}
          METRICS_USERNAME: kairui1012

      - name: Commit updated SVG
        run: |
          if git diff --quiet -- github-metrics.svg; then
            echo "Language metrics are already current."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add github-metrics.svg
          git commit -m "Update language metrics [skip ci]"
          git push
