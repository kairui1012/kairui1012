<svg width="1200" height="300" viewBox="0 0 1200 300" fill="none" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="title desc">
  <title id="title">Sam Kai Rui — Software Developer</title>
  <desc id="desc">A dark blue profile banner with green accents and software development symbols.</desc>
  <defs>
    <linearGradient id="background" x1="72" y1="18" x2="1128" y2="282" gradientUnits="userSpaceOnUse">
      <stop stop-color="#07182D"/>
      <stop offset="0.55" stop-color="#0B2742"/>
      <stop offset="1" stop-color="#123D52"/>
    </linearGradient>
    <linearGradient id="accent" x1="70" y1="0" x2="750" y2="0" gradientUnits="userSpaceOnUse">
      <stop stop-color="#2DD4BF"/>
      <stop offset="1" stop-color="#60A5FA"/>
    </linearGradient>
    <filter id="blur" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="44"/>
    </filter>
  </defs>

  <rect width="1200" height="300" rx="28" fill="url(#background)"/>
  <circle cx="1075" cy="40" r="145" fill="#2DD4BF" fill-opacity="0.12" filter="url(#blur)"/>
  <circle cx="900" cy="300" r="150" fill="#60A5FA" fill-opacity="0.12" filter="url(#blur)"/>

  <g opacity="0.16" stroke="#B8E8E1">
    <path d="M850 0V300"/>
    <path d="M930 0V300"/>
    <path d="M1010 0V300"/>
    <path d="M1090 0V300"/>
    <path d="M1170 0V300"/>
    <path d="M810 60H1200"/>
    <path d="M810 140H1200"/>
    <path d="M810 220H1200"/>
  </g>

  <rect x="70" y="52" width="72" height="34" rx="17" fill="#2DD4BF" fill-opacity="0.14" stroke="#2DD4BF" stroke-opacity="0.7"/>
  <text x="106" y="75" text-anchor="middle" fill="#8AF4E4" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="14" font-weight="700" letter-spacing="1.5">HELLO</text>

  <text x="70" y="145" fill="#F8FAFC" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="58" font-weight="750" letter-spacing="-1.5">Sam Kai Rui</text>
  <rect x="70" y="166" width="560" height="4" rx="2" fill="url(#accent)"/>
  <text x="70" y="213" fill="#BFD3E4" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="25" font-weight="500" letter-spacing="0.4">Software Developer · Kuala Lumpur</text>
  <text x="70" y="252" fill="#7FA3BB" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="16">building reliable products from interface to infrastructure</text>

  <g transform="translate(910 88)" stroke="url(#accent)" stroke-width="9" stroke-linecap="round" stroke-linejoin="round">
    <path d="M52 18L8 62L52 106"/>
    <path d="M138 18L182 62L138 106"/>
    <path d="M116 2L76 122"/>
  </g>
</svg>
